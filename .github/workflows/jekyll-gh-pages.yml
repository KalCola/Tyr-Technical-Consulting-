name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p _site && for f in CNAME .nojekyll robots.txt sitemap.xml index.html 404.html manifest.webmanifest sw.js css js data assets public; do [ -e "$f" ] && cp -r "$f" _site/; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dep
        uses: actions/deploy-pages@v4
