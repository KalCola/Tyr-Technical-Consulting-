name: Pages Verify

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '22'

      - name: Verify Web Catalog Integrity
        run: |
          test -f CNAME || exit 1
          test -f .nojekyll || exit 1
          test -f robots.txt || exit 1
          test -f sitemap.xml || exit 1
          test -f index.html || exit 1
          test -f 404.html || exit 1
          test -f manifest.webmanifest || exit 1
          test -f sw.js || exit 1
          test -f css/base.css || exit 1
          test -f css/deck.css || exit 1
          test -f css/responsive.css || exit 1
          test -f js/stripe-checkout.js || exit 1
          test -f js/forensics.js || exit 1
          test -f js/growth-kit.js || exit 1
          test -f js/deck.js || exit 1
          test -f js/app.js || exit 1
          test -f assets/3d_card.html || exit 1
          test -f data/catalog.json || exit 1
          grep -q 'og:title' index.html || exit 1
          grep -q 'application/ld+json' index.html || exit 1
          node --check js/stripe-checkout.js js/forensics.js js/growth-kit.js js/deck.js js/app.js
          node -e "const c = require('./data/catalog.json'); const count = c.pages.reduce((a, p) => a + (p.services ? p.services.length : 0), 0); console.log('Catalog SKU count:', count); if (count < 36 || !c.realms || c.realms.length < 14) process.exit(1);"

      - name: Upload Pages Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tyr-storefront-pages
          path: |
            CNAME
            .nojekyll
            robots.txt
            sitemap.xml
            index.html
            404.html
            manifest.webmanifest
            sw.js
            css/
            js/
            data/
            assets/
