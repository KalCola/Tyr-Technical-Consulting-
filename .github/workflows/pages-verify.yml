name: GitHub Pages verification

on:
  push:
    branches:
      - main
      - add/pages-verification
  workflow_dispatch:

env:
  IMAGE_MAX_BYTES: 300000
  LIGHTHOUSE_THRESHOLD: 90
  SITE_URL: http://127.0.0.1:8080

jobs:
  pages-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Init log files
        run: |
          touch html-check.txt
          touch http-server.log
          touch headers.txt
          echo "[]" > \
            pa11y-results.json
          echo "{}" > \
            lighthouse-report.json

      - name: Install dependencies
        run: |
          npm install -g \
            html-validator-cli \
            http-server \
            pa11y@6 \
            lighthouse

      - name: Validate structure
        run: |
          set -e
          for f in \
            index.html \
            404.html \
            CNAME
          do
            if [ ! -f "$f" ]; then
              echo "Missing: $f" >&2
              exit 1
            fi
          done

      - name: Validate HTML
        run: |
          html-validator \
            --file=index.html \
            --validator=WHATWG \
            --verbose \
            > html-check.txt || true
          cat html-check.txt

      - name: Start HTTP server
        run: |
          nohup http-server \
            -p 8080 . \
            >http-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS "$SITE_URL" \
              >/dev/null && break
            sleep 1
          done
          curl -fsS "$SITE_URL" \
            >/dev/null

      - name: Check asset URLs
        run: |
          set -e
          P1='(?<=(src|href)='
          P2='["\x27])[^"\x27]+'
          grep -oP "${P1}${P2}" \
            index.html > assets.txt \
            || true
          while read -r a; do
            case "$a" in
              ""|\#*|data:*)
                continue ;;
              mailto:*|tel:*)
                continue ;;
              javascript:*|http*)
                continue ;;
              *)
                p="${a#./}"
                p="${p#/}"
                p="${p%%\?*}"
                p="${p%%\#*}"
                [ -z "$p" ] && \
                  continue
                u="$SITE_URL/$p" ;;
            esac
            echo "Checking $u"
            code=$(curl -sL \
              -o /dev/null \
              -w "%{http_code}" \
              "$u")
            if [ "$code" != "200" ]
            then
              echo "Fail: $u ($code)"
              exit 1
            fi
          done < assets.txt

      - name: Accessibility scan
        run: |
          cat << 'EOF' > pa11y.json
          {
            "chromeLaunchConfig": {
              "args": [
                "--no-sandbox",
                "--disable-gpu"
              ]
            }
          }
          EOF
          pa11y "$SITE_URL" \
            --config pa11y.json \
            --reporter json \
            > pa11y-results.json \
            || true

      - name: Run Lighthouse
        run: |
          F="--headless"
          F="$F --no-sandbox"
          F="$F --disable-gpu"
          S="disable-dev-shm-usage"
          F="$F --$S"
          O=./lighthouse-report.json
          lighthouse "$SITE_URL" \
            --chrome-flags="$F" \
            --output=json \
            --output-path="$O" \
            --quiet || true

      - name: Lighthouse thresholds
        run: |
          node << 'NODE'
          const fs = require('fs');
          const p =
            './lighthouse-report.json';
          const r = JSON.parse(
            fs.readFileSync(p, 'utf8')
          );
          if (!r.categories) {
            console.warn('No report');
            process.exit(0);
          }
          const cats = [
            'performance',
            'accessibility',
            'best-practices',
            'seo'
          ];
          const min = Number(
            process.env
              .LIGHTHOUSE_THRESHOLD
              || 90
          );
          for (const c of cats) {
            const raw =
              r.categories?.[c]?.score;
            const s = raw == null
              ? 0
              : Math.round(raw * 100);
            console.log(`${c}: ${s}`);
            if (s < min) {
              console.warn(
                `::warning::${c}: ${s}`
              );
            }
          }
          NODE

      - name: Image size check
        run: |
          set -e
          P1='(?<=src=["\x27])'
          P2='[^"\x27]+'
          E='(jpe?g|png|webp|gif)$'
          grep -oP "${P1}${P2}" \
            index.html \
            | grep -Ei "\.${E}" \
            > imgs.txt || true
          MAX="$IMAGE_MAX_BYTES"
          while read -r img; do
            f="${img#./}"
            f="${f#/}"
            if [ -f "$f" ]; then
              sz=$(stat -c\%s "$f")
              echo "$f:$sz bytes"
              if [ "$sz" -gt "$MAX" ]
              then
                echo "::warning \
                  file=$f::$sz bytes"
              fi
            fi
          done < imgs.txt

      - name: Check headers & CNAME
        run: |
          set -e
          curl -sSLI "$SITE_URL" \
            | tee headers.txt
          cat CNAME

      - name: Upload artifacts
        if: always()
        uses: >-
          actions/upload-artifact@v7
        with:
          name: >-
            pages-verify-artifacts
          if-no-files-found: ignore
          path: |
            html-check.txt
            pa11y-results.json
            lighthouse-report.json
            headers.txt
            http-server.log
