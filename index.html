<!DOCTYPE html>
<html lang="en" data-device="desktop" data-uach="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <!-- Standards-Compliant HTTP User-Agent Client Hints Negotiation -->
    <meta http-equiv="Accept-CH" content="Sec-CH-UA, Sec-CH-UA-Mobile, Sec-CH-UA-Platform, Sec-CH-UA-Platform-Version, Sec-CH-UA-Model, Sec-CH-UA-Form-Factors, Viewport-Width, DPR">
    <title>TYR Technical Consulting | Nine Realms Paginated Storefront (15 Services &amp; Monthly Optimization Plans)</title>
    <style>
        :root {
            /* Core Obsidian & Blood Red Foundation */
            --bg-obsidian: #060609;
            --bg-surface: #0c0d13;
            --bg-card: #11131a;
            --bg-attr: #090a0f;
            --border-subtle: #232634;
            --text-main: #f4f5f8;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --steel-silver: #e2e8f0;

            /* Nine Realms Color Palette Tokens */
            /* 1. Midgard (Websites & Public Presence) — Sovereign Blood Crimson */
            --midgard-main: #dc2626;
            --midgard-light: #f87171;
            --midgard-bg: rgba(220, 38, 38, 0.13);
            --midgard-border: rgba(220, 38, 38, 0.52);
            --midgard-grad: linear-gradient(180deg, rgba(220, 38, 38, 0.12) 0%, #11131a 44%);

            /* 2. Asgard (Domains, Email Shield & Watchtower) — Imperial Bifrost Gold */
            --asgard-main: #d97706;
            --asgard-light: #fbbf24;
            --asgard-bg: rgba(245, 158, 11, 0.13);
            --asgard-border: rgba(245, 158, 11, 0.52);
            --asgard-grad: linear-gradient(180deg, rgba(245, 158, 11, 0.12) 0%, #11131a 44%);

            /* 3. Vanaheim (QR Menus, Forms & Local Commerce) — Verdant Harvest Emerald */
            --vanaheim-main: #059669;
            --vanaheim-light: #34d399;
            --vanaheim-bg: rgba(16, 185, 129, 0.13);
            --vanaheim-border: rgba(16, 185, 129, 0.52);
            --vanaheim-grad: linear-gradient(180deg, rgba(16, 185, 129, 0.12) 0%, #11131a 44%);

            /* 4. Alfheim (Resumes, Bids & Admin Concierge) — Luminous Starlight Cyan */
            --alfheim-main: #0284c7;
            --alfheim-light: #38bdf8;
            --alfheim-bg: rgba(56, 189, 248, 0.13);
            --alfheim-border: rgba(56, 189, 248, 0.52);
            --alfheim-grad: linear-gradient(180deg, rgba(56, 189, 248, 0.12) 0%, #11131a 44%);

            /* 5. Nidavellir (3-Doc Fillable E-Sign Contracts) — Dwarven Forge Copper/Bronze */
            --nidavellir-main: #ea580c;
            --nidavellir-light: #fb923c;
            --nidavellir-bg: rgba(234, 88, 12, 0.13);
            --nidavellir-border: rgba(234, 88, 12, 0.52);
            --nidavellir-grad: linear-gradient(180deg, rgba(234, 88, 12, 0.12) 0%, #11131a 44%);

            /* 6. Muspelheim (Vehicle & Equipment Buyer's Guide) — Primordial Flame Rose-Red */
            --muspelheim-main: #e11d48;
            --muspelheim-light: #fb7185;
            --muspelheim-bg: rgba(225, 29, 72, 0.13);
            --muspelheim-border: rgba(225, 29, 72, 0.52);
            --muspelheim-grad: linear-gradient(180deg, rgba(225, 29, 72, 0.12) 0%, #11131a 44%);

            /* 7. Svartalfheim (Budget Trackers & Monthly Expense Optimization) — Deep Treasury Amethyst */
            --svartalfheim-main: #9333ea;
            --svartalfheim-light: #c084fc;
            --svartalfheim-bg: rgba(168, 85, 247, 0.13);
            --svartalfheim-border: rgba(168, 85, 247, 0.52);
            --svartalfheim-grad: linear-gradient(180deg, rgba(168, 85, 247, 0.12) 0%, #11131a 44%);

            /* 8. Niflheim / Helheim (Home Insurance & Legacy Vault) — Glacial Frost Teal */
            --niflheim-main: #0d9488;
            --niflheim-light: #2dd4bf;
            --niflheim-bg: rgba(20, 184, 166, 0.13);
            --niflheim-border: rgba(20, 184, 166, 0.52);
            --niflheim-grad: linear-gradient(180deg, rgba(20, 184, 166, 0.12) 0%, #11131a 44%);

            /* 9. Jotunheim (Billing Disputes & Monthly Bill Watchdog) — Frost-Giant Indigo Steel */
            --jotunheim-main: #4f46e5;
            --jotunheim-light: #818cf8;
            --jotunheim-bg: rgba(99, 102, 241, 0.13);
            --jotunheim-border: rgba(99, 102, 241, 0.52);
            --jotunheim-grad: linear-gradient(180deg, rgba(99, 102, 241, 0.12) 0%, #11131a 44%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-obsidian);
            background-image:
                radial-gradient(circle at 12% 0%, rgba(220, 38, 38, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 88% 8%, rgba(217, 119, 6, 0.10) 0%, transparent 38%);
            color: var(--text-main);
            line-height: 1.48;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Executive Bar with UA-CH Telemetry Pill */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(6, 6, 9, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--midgard-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.75);
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
            color: var(--text-main);
            flex-shrink: 0;
        }

        .nav-rune-badge {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--midgard-main), #7f1d1d);
            border: 1px solid var(--asgard-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1em;
            font-weight: 800;
            color: #ffffff;
        }

        .nav-brand-text {
            font-weight: 800;
            font-size: 0.94em;
            letter-spacing: 0.7px;
            white-space: nowrap;
        }

        .nav-brand-text span {
            color: var(--midgard-light);
            font-weight: 600;
        }

        /* UA-CH Client Hints Telemetry & Mode Switcher */
        .uach-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            background: var(--bg-attr);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.72em;
        }

        .uach-status {
            font-family: ui-monospace, SFMono-Regular, monospace;
            color: var(--asgard-light);
            font-weight: 700;
            white-space: nowrap;
        }

        .uach-btn {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 0.95em;
            font-weight: 700;
            cursor: pointer;
        }

        .uach-btn.active {
            background: var(--midgard-bg);
            color: #ffffff;
            border-color: var(--midgard-main);
        }

        .nav-cta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.78em;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--midgard-main), #991b1b);
            color: #ffffff;
            border: 1px solid var(--midgard-light);
        }

        .btn-outline {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--asgard-border);
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 12px 18px 18px 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Compact Executive Hero (Engineered for Zero-Scroll Viewport Fit) */
        .hero {
            background: linear-gradient(140deg, #160a0d 0%, #0b0c12 55%, #171108 100%);
            border: 1px solid var(--midgard-border);
            border-left: 4px solid var(--midgard-main);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .hero-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1 1 480px;
        }

        .logo-img {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            border: 2px solid var(--midgard-main);
            box-shadow: 0 0 14px rgba(220, 38, 38, 0.45);
            object-fit: cover;
            flex-shrink: 0;
        }

        .eyebrow {
            font-size: 0.66em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.9px;
            color: var(--asgard-light);
            margin-bottom: 2px;
        }

        h1 {
            color: #ffffff;
            font-size: 1.42em;
            margin: 0 0 2px 0;
            letter-spacing: 0.3px;
            line-height: 1.15;
        }

        h1 .accent {
            color: var(--midgard-light);
        }

        .hero-sub {
            color: var(--text-secondary);
            font-size: 0.81em;
            margin: 0;
        }

        .hero-attributes {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 7px;
            flex: 1 1 510px;
        }

        .attr-box {
            background: var(--bg-attr);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 5px 8px;
        }

        .attr-box.r-midgard { border-left: 3px solid var(--midgard-main); }
        .attr-box.r-asgard { border-left: 3px solid var(--asgard-main); }
        .attr-box.r-niflheim { border-left: 3px solid var(--niflheim-main); }
        .attr-box.r-svartalfheim { border-left: 3px solid var(--svartalfheim-main); }

        .attr-label {
            font-size: 0.60em;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 700;
            display: block;
        }

        .attr-val {
            font-size: 0.74em;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
        }

        /* Multi-Page Deck Navigation & 9-Realm Legend Bar */
        .deck-nav-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 9px;
            padding: 8px 11px;
            margin-bottom: 10px;
        }

        .page-tabs-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            padding-bottom: 7px;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 7px;
        }

        .page-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            flex: 1;
        }

        .page-tab {
            flex: 1 1 auto;
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            border-top: 2px solid transparent;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 0.72em;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.16s ease;
            white-space: nowrap;
        }

        .page-tab:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.04);
        }

        .page-tab.active[data-page="1"] {
            background: var(--midgard-bg);
            color: #ffffff;
            border-color: var(--midgard-border);
            border-top: 2px solid var(--midgard-main);
        }
        .page-tab.active[data-page="2"] {
            background: var(--alfheim-bg);
            color: #ffffff;
            border-color: var(--alfheim-border);
            border-top: 2px solid var(--alfheim-light);
        }
        .page-tab.active[data-page="3"] {
            background: var(--niflheim-bg);
            color: #ffffff;
            border-color: var(--niflheim-border);
            border-top: 2px solid var(--niflheim-light);
        }
        .page-tab.active[data-page="4"] {
            background: var(--asgard-bg);
            color: #ffffff;
            border-color: var(--asgard-border);
            border-top: 2px solid var(--asgard-light);
        }
        .page-tab.active[data-page="5"] {
            background: var(--svartalfheim-bg);
            color: #ffffff;
            border-color: var(--svartalfheim-border);
            border-top: 2px solid var(--svartalfheim-light);
        }
        .page-tab.active[data-page="6"] {
            background: var(--vanaheim-bg);
            color: #ffffff;
            border-color: var(--vanaheim-border);
            border-top: 2px solid var(--vanaheim-light);
        }
        .page-tab.active[data-page="all"] {
            background: var(--midgard-bg);
            color: #ffffff;
            border-color: var(--midgard-main);
        }

        /* 9-Realm Compact Color Legend */
        .realm-legend {
            display: grid;
            grid-template-columns: repeat(9, minmax(0, 1fr));
            gap: 5px;
        }

        .legend-chip {
            background: var(--bg-attr);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 3px 4px;
            text-align: center;
            font-size: 0.61em;
            line-height: 1.2;
            cursor: pointer;
        }

        .legend-chip strong {
            display: block;
            font-size: 1.02em;
        }

        .legend-chip span {
            color: var(--text-muted);
            font-size: 0.89em;
        }

        /* Paginated Views — Only Active Page Renders to Eliminate Vertical Scrolling */
        .deck-page {
            display: none;
            animation: fadeIn 0.18s ease-out;
        }

        .deck-page.active-page {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0.4; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            padding-left: 12px;
            margin: 2px 0 6px 0;
        }

        .section-header.sec-01 { border-left: 4px solid var(--midgard-main); }
        .section-header.sec-02 { border-left: 4px solid var(--alfheim-light); }
        .section-header.sec-03 { border-left: 4px solid var(--niflheim-light); }
        .section-header.sec-04 { border-left: 4px solid var(--asgard-light); }
        .section-header.sec-05 { border-left: 4px solid var(--svartalfheim-light); }

        .section-header h2 {
            color: #ffffff;
            margin: 0;
            font-size: 1.12em;
        }

        .section-header .rune-tag {
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 0.74em;
            font-weight: 700;
        }

        .section-desc {
            color: var(--text-muted);
            font-size: 0.80em;
            margin: -3px 0 9px 16px;
        }

        /* Mobile / Single-Card Sub-Stepper */
        .mobile-card-stepper {
            display: none;
            gap: 6px;
            margin-bottom: 9px;
        }

        .mob-step-btn {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.75em;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .mob-step-btn.active {
            background: var(--midgard-bg);
            color: #ffffff;
            border-color: var(--midgard-main);
        }

        /* 3-Column Card Grid on Desktop */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 10px;
        }

        /* Base Service Card + Per-Realm Color Theming */
        .card {
            min-width: 0;
            background: var(--realm-grad, var(--bg-card));
            border: 1px solid var(--realm-border, var(--border-subtle));
            border-top: 3px solid var(--realm-main, var(--midgard-main));
            border-radius: 9px;
            padding: 13px 14px 11px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        /* Realm Theme Classes */
        .theme-midgard {
            --realm-main: var(--midgard-main);
            --realm-light: var(--midgard-light);
            --realm-bg: var(--midgard-bg);
            --realm-border: var(--midgard-border);
            --realm-grad: var(--midgard-grad);
        }
        .theme-asgard {
            --realm-main: var(--asgard-main);
            --realm-light: var(--asgard-light);
            --realm-bg: var(--asgard-bg);
            --realm-border: var(--asgard-border);
            --realm-grad: var(--asgard-grad);
        }
        .theme-vanaheim {
            --realm-main: var(--vanaheim-main);
            --realm-light: var(--vanaheim-light);
            --realm-bg: var(--vanaheim-bg);
            --realm-border: var(--vanaheim-border);
            --realm-grad: var(--vanaheim-grad);
        }
        .theme-alfheim {
            --realm-main: var(--alfheim-main);
            --realm-light: var(--alfheim-light);
            --realm-bg: var(--alfheim-bg);
            --realm-border: var(--alfheim-border);
            --realm-grad: var(--alfheim-grad);
        }
        .theme-nidavellir {
            --realm-main: var(--nidavellir-main);
            --realm-light: var(--nidavellir-light);
            --realm-bg: var(--nidavellir-bg);
            --realm-border: var(--nidavellir-border);
            --realm-grad: var(--nidavellir-grad);
        }
        .theme-muspelheim {
            --realm-main: var(--muspelheim-main);
            --realm-light: var(--muspelheim-light);
            --realm-bg: var(--muspelheim-bg);
            --realm-border: var(--muspelheim-border);
            --realm-grad: var(--muspelheim-grad);
        }
        .theme-svartalfheim {
            --realm-main: var(--svartalfheim-main);
            --realm-light: var(--svartalfheim-light);
            --realm-bg: var(--svartalfheim-bg);
            --realm-border: var(--svartalfheim-border);
            --realm-grad: var(--svartalfheim-grad);
        }
        .theme-niflheim {
            --realm-main: var(--niflheim-main);
            --realm-light: var(--niflheim-light);
            --realm-bg: var(--niflheim-bg);
            --realm-border: var(--niflheim-border);
            --realm-grad: var(--niflheim-grad);
        }
        .theme-jotunheim {
            --realm-main: var(--jotunheim-main);
            --realm-light: var(--jotunheim-light);
            --realm-bg: var(--jotunheim-bg);
            --realm-border: var(--jotunheim-border);
            --realm-grad: var(--jotunheim-grad);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 7px;
        }

        .sku-line {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 6px;
            margin-bottom: 3px;
            white-space: nowrap;
        }

        .rune-pill {
            background: var(--realm-bg);
            border: 1px solid var(--realm-border);
            color: var(--realm-light);
            font-weight: 800;
            font-size: 0.67em;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .code-tag {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.68em;
            font-weight: 700;
            color: var(--text-muted);
        }

        .realm-meaning {
            font-size: 0.69em;
            color: var(--realm-light);
            font-weight: 600;
            margin-bottom: 2px;
            display: block;
        }

        .card h3 {
            color: #ffffff;
            margin: 0;
            font-size: 1.01em;
            line-height: 1.22;
        }

        .price-box {
            text-align: right;
            flex-shrink: 0;
        }

        .price {
            color: var(--realm-light);
            font-size: 1.20em;
            font-weight: 800;
            white-space: nowrap;
            display: block;
            line-height: 1.1;
        }

        .price-sub {
            font-size: 0.61em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        /* Structured 3-Cell Attribute Strip */
        .attr-strip {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            background: var(--bg-attr);
            border: 1px solid var(--border-subtle);
            border-left: 2px solid var(--realm-main);
            border-radius: 6px;
            padding: 5px 8px;
            margin-bottom: 8px;
        }

        .attr-cell {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .attr-cell .k {
            font-size: 0.57em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 700;
            white-space: nowrap;
        }

        .attr-cell .v {
            font-size: 0.71em;
            color: var(--steel-silver);
            font-weight: 700;
            white-space: nowrap;
        }

        .attr-cell .v.realm-v {
            color: var(--realm-light);
        }

        .card ul {
            padding-left: 15px;
            margin: 0 0 8px 0;
            color: var(--text-secondary);
            font-size: 0.80em;
        }

        .card li {
            margin-bottom: 4px;
        }

        .card li strong {
            color: #ffffff;
        }

        .card-footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding-top: 7px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
        }

        .badge {
            background-color: var(--bg-attr);
            border: 1px solid var(--realm-border);
            color: var(--text-secondary);
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 0.68em;
            font-weight: 600;
            white-space: nowrap;
        }

        .spec-tag {
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 0.65em;
            color: var(--realm-light);
            font-weight: 600;
            white-space: nowrap;
        }

        /* Flagship Bundle & Zero-Custody Banner */
        .bundle-banner {
            background: linear-gradient(135deg, #1b090d 0%, #10121b 48%, #191207 100%);
            border: 1px solid var(--asgard-border);
            border-left: 5px solid var(--midgard-main);
            border-right: 5px solid var(--asgard-main);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .bundle-banner h3 {
            margin: 2px 0 4px 0;
            color: #ffffff;
            font-size: 1.08em;
        }

        .bundle-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .bundle-option {
            background: rgba(6, 6, 9, 0.72);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 0.77em;
            color: var(--text-secondary);
        }

        .bundle-option.opt-steward { border-left: 3px solid var(--asgard-light); }
        .bundle-option.opt-launch { border-left: 3px solid var(--svartalfheim-light); }

        .bundle-option strong {
            color: #ffffff;
            display: block;
            margin-bottom: 2px;
            font-size: 0.95em;
        }

        .bundle-price-col {
            text-align: right;
            min-width: 195px;
            background: var(--bg-attr);
            border: 1px solid var(--asgard-border);
            border-radius: 8px;
            padding: 9px 14px;
        }

        .bundle-price {
            font-size: 1.44em;
            font-weight: 800;
            color: var(--asgard-light);
            line-height: 1.1;
        }

        /* 3-Step Client Onboarding Workflow */
        .workflow-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 12px;
        }

        .workflow-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 13px 15px;
        }

        .workflow-card.wf-1 { border-left: 3px solid var(--midgard-main); }
        .workflow-card.wf-2 { border-left: 3px solid var(--asgard-main); }
        .workflow-card.wf-3 { border-left: 3px solid var(--svartalfheim-main); }

        .workflow-card .step-num {
            font-family: ui-monospace, monospace;
            font-size: 0.71em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            display: block;
            margin-bottom: 4px;
        }

        .workflow-card h4 {
            margin: 0 0 4px 0;
            color: #ffffff;
            font-size: 0.95em;
        }

        .workflow-card p {
            margin: 0;
            font-size: 0.80em;
            color: var(--text-secondary);
        }

        /* Bottom Deck Pager Bar */
        .bottom-pager {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 4px;
        }

        .pager-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--midgard-border);
            border-radius: 6px;
            padding: 5px 13px;
            font-size: 0.77em;
            font-weight: 700;
            cursor: pointer;
        }

        .pager-btn:hover {
            background: var(--midgard-bg);
        }

        .pager-indicator {
            font-size: 0.77em;
            color: var(--text-secondary);
            font-weight: 600;
            text-align: center;
        }

        footer {
            margin-top: 8px;
            padding-top: 7px;
            border-top: 1px solid var(--border-subtle);
            font-size: 0.73em;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
        }

        /* ============================================================================
           USER-AGENT CLIENT HINTS (UA-CH) HORIZONTAL SINGLE-CARD STEPPER DYNAMICS
           Keeps uniform horizontal card geometry while stepping 1 card at a time
           ============================================================================ */
        html[data-device="mobile"] .realm-legend {
            display: none;
        }
        html[data-device="mobile"] .page-tabs-row {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        html[data-device="mobile"] .mobile-card-stepper {
            display: flex;
        }
        html[data-device="mobile"] .grid-3 {
            grid-template-columns: 1fr;
        }
        html[data-device="mobile"] .grid-3 .card {
            display: none;
        }
        html[data-device="mobile"] .grid-3 .card.mob-active-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px 20px;
        }
        html[data-device="mobile"] .grid-3 .card.mob-active-card ul {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            list-style: none;
            padding-left: 0;
            margin: 6px 0 10px 0;
        }
        html[data-device="mobile"] .grid-3 .card.mob-active-card li {
            background: var(--bg-attr);
            border: 1px solid var(--border-subtle);
            border-left: 3px solid var(--realm-main);
            border-radius: 6px;
            padding: 9px 11px;
            margin-bottom: 0;
        }
        @media (max-width: 720px) {
            html[data-device="mobile"] .grid-3 .card.mob-active-card ul {
                grid-template-columns: 1fr;
            }
            html[data-device="mobile"] .hero-attributes {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
