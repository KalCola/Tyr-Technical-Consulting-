            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            border-top: 2px solid transparent;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 0.72em;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.16s ease;
            white-space: nowrap;
        }

        .page-tab:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.04);
        }

        .page-tab.active[data-page="1"] {
            background: var(--midgard-bg);
            color: #ffffff;
            border-color: var(--midgard-border);
            border-top: 2px solid var(--midgard-main);
        }
        .page-tab.active[data-page="2"] {
            background: var(--alfheim-bg);
            color: #ffffff;
            border-color: var(--alfheim-border);
            border-top: 2px solid var(--alfheim-light);
        }
        .page-tab.active[data-page="3"] {
            background: var(--niflheim-bg);
            color: #ffffff;
            border-color: var(--niflheim-border);
            border-top: 2px solid var(--niflheim-light);
        }
        .page-tab.active[data-page="4"] {
            background: var(--asgard-bg);
            color: #ffffff;
            border-color: var(--asgard-border);
            border-top: 2px solid var(--asgard-light);
        }
        .page-tab.active[data-page="5"] {
            background: var(--svartalfheim-bg);
            color: #ffffff;
            border-color: var(--svartalfheim-border);
            border-top: 2px solid var(--svartalfheim-light);
        }
        .page-tab.active[data-page="6"] {
            background: var(--vanaheim-bg);
            color: #ffffff;
            border-color: var(--vanaheim-border);
            border-top: 2px solid var(--vanaheim-light);
        }
        .page-tab.active[data-page="all"] {
            background: var(--midgard-bg);
            color: #ffffff;
            border-color: var(--midgard-main);
        }

        /* 9-Realm Compact Color Legend (Semantic Buttons) */
        .realm-legend {
            display: grid;
            grid-template-columns: repeat(9, minmax(0, 1fr));
            gap: 5px;
        }

        .legend-chip {
            background: var(--bg-attr);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 4px 4px;
            text-align: center;
            font-family: inherit;
            font-size: 0.62em;
            line-height: 1.2;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .legend-chip:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-1px);
        }

        .legend-chip strong {
            display: block;
            font-size: 1.02em;
        }

        .legend-chip span {
            color: var(--text-muted);
            font-size: 0.90em;
        }

        /* Paginated Views — Only Active Page Renders to Eliminate Vertical Scrolling */
        .deck-page {
            display: none;
            animation: fadeIn 0.18s ease-out;
        }

        .deck-page.active-page {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0.4; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            padding-left: 12px;
            margin: 2px 0 6px 0;
        }

        .section-header.sec-01 { border-left: 4px solid var(--midgard-main); }
        .section-header.sec-02 { border-left: 4px solid var(--alfheim-light); }
        .section-header.sec-03 { border-left: 4px solid var(--niflheim-light); }
        .section-header.sec-04 { border-left: 4px solid var(--asgard-light); }
        .section-header.sec-05 { border-left: 4px solid var(--svartalfheim-light); }

        .section-header h2 {
            color: #ffffff;
            margin: 0;
            font-size: 1.12em;
        }

        .section-header .rune-tag {
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 0.74em;
            font-weight: 700;
        }

        .section-desc {
            color: var(--text-muted);
            font-size: 0.80em;
            margin: -3px 0 9px 16px;
        }

        /* Mobile / Single-Card Sub-Stepper */
        .mobile-card-stepper {
            display: none;
            gap: 6px;
            margin-bottom: 9px;
        }

        .mob-step-btn {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.75em;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .mob-step-btn.active {
            background: var(--midgard-bg);
            color: #ffffff;
            border-color: var(--midgard-main);
        }

        /* 3-Column Card Grid on Desktop */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 10px;
        }

        /* Base Service Card + Per-Realm Color Theming */
        .card {
            min-width: 0;
            background: var(--realm-grad, var(--bg-card));
            border: 1px solid var(--realm-border, var(--border-subtle));
            border-top: 3px solid var(--realm-main, var(--midgard-main));
            border-radius: 9px;
            padding: 13px 14px 11px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        /* Realm Theme Classes */
        .theme-midgard {
            --realm-main: var(--midgard-main);
            --realm-light: var(--midgard-light);
            --realm-bg: var(--midgard-bg);
            --realm-border: var(--midgard-border);
            --realm-grad: var(--midgard-grad);
        }
        .theme-asgard {
            --realm-main: var(--asgard-main);
            --realm-light: var(--asgard-light);
            --realm-bg: var(--asgard-bg);
            --realm-border: var(--asgard-border);
            --realm-grad: var(--asgard-grad);
        }
        .theme-vanaheim {
            --realm-main: var(--vanaheim-main);
            --realm-light: var(--vanaheim-light);
            --realm-bg: var(--vanaheim-bg);
            --realm-border: var(--vanaheim-border);
            --realm-grad: var(--vanaheim-grad);
        }
        .theme-alfheim {
            --realm-main: var(--alfheim-main);
            --realm-light: var(--alfheim-light);
            --realm-bg: var(--alfheim-bg);
            --realm-border: var(--alfheim-border);
            --realm-grad: var(--alfheim-grad);
        }
        .theme-nidavellir {
            --realm-main: var(--nidavellir-main);
            --realm-light: var(--nidavellir-light);
            --realm-bg: var(--nidavellir-bg);
            --realm-border: var(--nidavellir-border);
            --realm-grad: var(--nidavellir-grad);
        }
        .theme-muspelheim {
            --realm-main: var(--muspelheim-main);
            --realm-light: var(--muspelheim-light);
            --realm-bg: var(--muspelheim-bg);
            --realm-border: var(--muspelheim-border);
            --realm-grad: var(--muspelheim-grad);
        }
        .theme-svartalfheim {
            --realm-main: var(--svartalfheim-main);
            --realm-light: var(--svartalfheim-light);
            --realm-bg: var(--svartalfheim-bg);
            --realm-border: var(--svartalfheim-border);
            --realm-grad: var(--svartalfheim-grad);
        }
        .theme-niflheim {
            --realm-main: var(--niflheim-main);
            --realm-light: var(--niflheim-light);
            --realm-bg: var(--niflheim-bg);
            --realm-border: var(--niflheim-border);
            --realm-grad: var(--niflheim-grad);
        }
        .theme-jotunheim {
            --realm-main: var(--jotunheim-main);
            --realm-light: var(--jotunheim-light);
            --realm-bg: var(--jotunheim-bg);
            --realm-border: var(--jotunheim-border);
            --realm-grad: var(--jotunheim-grad);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 7px;
        }

        .sku-line {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin-bottom: 3px;
        }

        .rune-pill {
            background: var(--realm-bg);
            border: 1px solid var(--realm-border);
            color: var(--realm-light);
            font-weight: 800;
            font-size: 0.67em;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .code-tag {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.68em;
            font-weight: 700;
            color: var(--text-muted);
        }

        .realm-meaning {
            font-size: 0.69em;
            color: var(--realm-light);
            font-weight: 600;
            margin-bottom: 2px;
            display: block;
        }

        .card h3 {
            color: #ffffff;
            margin: 0;
            font-size: 1.01em;
            line-height: 1.22;
        }

        .price-box {
            text-align: right;
            flex-shrink: 0;
        }

        .price {
            color: var(--realm-light);
            font-size: 1.20em;
            font-weight: 800;
            white-space: nowrap;
            display: block;
            line-height: 1.1;
        }

        .price-sub {
            font-size: 0.61em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        /* Structured 3-Cell Attribute Strip */
        .attr-strip {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            background: var(--bg-attr);
            border: 1px solid var(--border-subtle);
            border-left: 2px solid var(--realm-main);
            border-radius: 6px;
            padding: 5px 8px;
            margin-bottom: 8px;
        }

        .attr-cell {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .attr-cell .k {
            font-size: 0.58em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 700;
            white-space: nowrap;
        }

        .attr-cell .v {
            font-size: 0.71em;
            color: var(--steel-silver);
            font-weight: 700;
            white-space: nowrap;
        }

        .attr-cell .v.realm-v {
            color: var(--realm-light);
        }

        .card ul {
            padding-left: 15px;
            margin: 0 0 8px 0;
            color: var(--text-secondary);
            font-size: 0.80em;
        }

        .card li {
            margin-bottom: 4px;
        }

        .card li strong {
            color: #ffffff;
        }

        .card-footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding-top: 7px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
        }

        .badge {
            background-color: var(--bg-attr);
            border: 1px solid var(--realm-border);
            color: var(--text-secondary);
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 0.68em;
            font-weight: 600;
            white-space: nowrap;
        }

        .spec-tag {
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 0.65em;
            color: var(--realm-light);
            font-weight: 600;
            white-space: nowrap;
        }

        /* Flagship Bundle & Zero-Custody Banner */
        .bundle-banner {
            background: linear-gradient(135deg, #1b090d 0%, #10121b 48%, #191207 100%);
            border: 1px solid var(--asgard-border);
            border-left: 5px solid var(--midgard-main);
            border-right: 5px solid var(--asgard-main);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .bundle-banner h3 {
            margin: 2px 0 4px 0;
            color: #ffffff;
            font-size: 1.08em;
        }

        .bundle-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .bundle-option {
            background: rgba(6, 6, 9, 0.72);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 0.77em;
            color: var(--text-secondary);
        }

        .bundle-option.opt-steward { border-left: 3px solid var(--asgard-light); }
        .bundle-option.opt-launch { border-left: 3px solid var(--svartalfheim-light); }

        .bundle-option strong {
            color: #ffffff;
            display: block;
            margin-bottom: 2px;
            font-size: 0.95em;
        }

        .bundle-price-col {
            text-align: right;
            min-width: 195px;
            background: var(--bg-attr);
            border: 1px solid var(--asgard-border);
            border-radius: 8px;
            padding: 9px 14px;
        }

        .bundle-price {
            font-size: 1.44em;
            font-weight: 800;
            color: var(--asgard-light);
            line-height: 1.1;
        }

        /* 3-Step Client Onboarding Workflow */
        .workflow-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 12px;
        }

        .workflow-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 13px 15px;
        }

        .workflow-card.wf-1 { border-left: 3px solid var(--midgard-main); }
        .workflow-card.wf-2 { border-left: 3px solid var(--asgard-main); }
        .workflow-card.wf-3 { border-left: 3px solid var(--svartalfheim-main); }

        .workflow-card .step-num {
            font-family: ui-monospace, monospace;
            font-size: 0.71em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            display: block;
            margin-bottom: 4px;
        }

        .workflow-card h4 {
            margin: 0 0 4px 0;
            color: #ffffff;
            font-size: 0.95em;
        }

        .workflow-card p {
            margin: 0;
            font-size: 0.80em;
            color: var(--text-secondary);
        }

        /* Bottom Deck Pager Bar */
        .bottom-pager {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 8px 14px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 4px;
        }

        .pager-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--midgard-border);
            border-radius: 6px;
            padding: 5px 13px;
            font-size: 0.77em;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .pager-btn:hover {
            background: var(--midgard-bg);
        }

        .pager-indicator {
            font-size: 0.77em;
            color: var(--text-secondary);
            font-weight: 600;
            text-align: center;
        }

        footer {
            margin-top: 8px;
            padding-top: 7px;
            border-top: 1px solid var(--border-subtle);
            font-size: 0.73em;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .footer-link-btn {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 0.95em;
            cursor: pointer;
        }
        .footer-link-btn:hover {
            color: #ffffff;
            border-color: var(--midgard-border);
        }

        /* Cookie consent banner */
        #cookie-consent-banner {
            position: fixed;
            right: 12px;
            bottom: 12px;
            background: rgba(6, 6, 9, 0.96);
            border: 1px solid var(--midgard-border);
            color: var(--text-secondary);
            padding: 12px 14px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75);
            z-index: 9999;
            display: none;
            max-width: 360px;
            font-size: 0.88em;
        }
        #cookie-consent-banner p {
            margin: 0 0 10px 0;
            color: var(--text-secondary);
            font-size: 0.9em;
            line-height: 1.4;
        }
        #cookie-consent-banner .consent-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        /* ============================================================================
           USER-AGENT CLIENT HINTS (UA-CH) HORIZONTAL SINGLE-CARD STEPPER DYNAMICS
           Applies when data-device="mobile" (either via Auto UA-CH/viewport or Forced Mobile)
           ============================================================================ */
        html[data-device="mobile"] .realm-legend {
            display: none;
        }
        html[data-device="mobile"] .page-tabs-row {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        html[data-device="mobile"][data-view="paged"] .mobile-card-stepper {
            display: flex;
        }
        html[data-device="mobile"] .grid-3,
        html[data-device="mobile"] .workflow-grid,
        html[data-device="mobile"] .bundle-grid {
            grid-template-columns: 1fr;
        }
        html[data-device="mobile"][data-view="paged"] .grid-3 .card {
            display: none;
        }
        html[data-device="mobile"][data-view="paged"] .grid-3 .card.mob-active-card,
        html[data-device="mobile"][data-view="all"] .grid-3 .card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px 18px;
        }
        html[data-device="mobile"] .grid-3 .card ul {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            list-style: none;
            padding-left: 0;
            margin: 6px 0 10px 0;
        }
        html[data-device="mobile"] .grid-3 .card li {
            background: var(--bg-attr);
            border: 1px solid var(--border-subtle);
            border-left: 3px solid var(--realm-main);
            border-radius: 6px;
            padding: 9px 11px;
            margin-bottom: 0;
        }

        @media (max-width: 720px) {
            html[data-device="mobile"] .grid-3 .card ul {
                grid-template-columns: 1fr;
            }
            html[data-device="mobile"] .hero-attributes {
                grid-template-columns: repeat(2, 1fr);
            }
            html[data-device="mobile"] .nav-inner {
                flex-direction: column;
                align-items: stretch;
            }
            html[data-device="mobile"] .uach-bar,
            html[data-device="mobile"] .nav-cta {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to Nine Realms Storefront</a>

    <!-- Cookie Consent UI (Google Consent Mode v2) -->
    <div id="cookie-consent-banner" role="region" aria-live="polite" aria-label="Cookie and analytics consent">
        <p>We use privacy-safe analytics to measure storefront performance. Do you allow Google Ads conversion tracking on this site?</p>

            <button id="cookie-consent-accept" type="button" class="btn btn-primary">Accept</button>
        </div>
    </div>

    <!-- Top Executive Navigation + Live UA-CH Client Hints Telemetry -->
    <nav class="top-nav" aria-label="Primary navigation">

            <a href="#top" class="nav-brand" aria-label="TYR Technical Consulting home" onclick="showPage(1); return false;">
                <span class="nav-rune-badge" aria-hidden="true" title="Tiwaz — Tyr">ᛏ</span>
                <span class="nav-brand-text">TYR <span>| TECHNICAL CONSULTING</span></span>

            <!-- User-Agent Client Hints (UA-CH) Adaptive Screen Controller -->
            <div class="uach-bar" role="group" aria-label="Client hint layout mode controls">

                <a class="btn btn-primary" href="#contact" onclick="showPage(6); return false;">Book Strategy Call</a>

    <main class="container" id="top">
        <div id="main-content">
            <!-- Compact Hero Header -->
